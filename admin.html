<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nauka SW – panel kodów</title>
<style>
 :root{color-scheme:light dark;--bg:#eef2f7;--card:#fff;--txt:#16202c;--muted:#5d6b7c;--line:#d3dae4;--pri:#1f4f8a;--bad:#c0392b;--ok:#1e8449}
 @media (prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#18222f;--txt:#e6edf5;--muted:#9fb0c4;--line:#2e3d50;--pri:#4a86d4}}
 *{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
 main{max-width:760px;margin:0 auto;padding:14px}
 h1{font-size:22px;margin:6px 0 12px} h2{font-size:18px;margin:0 0 10px}
 .card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
 input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt)}
 textarea{min-height:120px} label{display:block;font-weight:600;margin:10px 0 4px}
 button{font:600 15px system-ui;padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer}
 button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)} button.bad{background:var(--bad)}
 .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .row>*{flex:1 1 auto}
 .muted{color:var(--muted);font-size:14px} .err{color:var(--bad);font-weight:600} .okm{color:var(--ok);font-weight:600}
 table{width:100%;border-collapse:collapse;font-size:15px} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 code{font:600 15px ui-monospace,monospace;letter-spacing:.06em}
 .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--line)} .tag.b{background:var(--bad);color:#fff}
 .acts{display:flex;gap:6px;flex-wrap:wrap} .acts button{padding:6px 9px;font-size:13px}
 pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:14px}
 .dev{font-size:13px;color:var(--muted)}
</style>
</head>
<body><main>
<h1>🔐 Nauka SW – panel kodów</h1>

<section class="card" id="login">
  <h2>Hasło administratora</h2>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="ADMIN_HASLO"><button id="pwb" style="flex:0 0 auto">Zaloguj</button></div>
  <p class="err" id="pwe"></p>
</section>

<div id="panel" hidden>
<section class="card">
  <h2>1. Kody osobiste (każdy swój kod)</h2>
  <label for="names">Imiona i nazwiska – jedna osoba w linii</label>
  <textarea id="names" placeholder="Jan Kowalski&#10;Anna Nowak&#10;…"></textarea>
  <label for="pmax">Ile urządzeń na jeden kod?</label>
  <select id="pmax"><option value="1">1 urządzenie</option><option value="2" selected>2 urządzenia (zalecane – np. telefon + ikona na iPhonie)</option><option value="3">3 urządzenia</option></select>
  <p><button id="genp">Utwórz kody osobiste</button></p>
</section>

<section class="card">
  <h2>2. Kod wspólny / uniwersalny</h2>
  <label for="gname">Nazwa (dla Ciebie)</label>
  <input id="gname" placeholder="np. Grupa 20 osób albo Kod uniwersalny">
  <label for="gmax">Limit urządzeń (0 = bez limitu, czyli kod uniwersalny)</label>
  <input id="gmax" type="number" min="0" max="1000" value="20">
  <label for="gcode">Własny kod (opcjonalnie, min. 6 znaków – litery i cyfry; puste = losowy)</label>
  <input id="gcode" placeholder="np. CHORAZY2026" autocapitalize="characters">
  <p><button id="geng">Utwórz kod</button></p>
</section>

<section class="card" id="newbox" hidden>
  <h2>✅ Nowe kody – skopiuj i roześlij</h2>
  <pre id="newlist"></pre>
  <button id="copy" class="ghost">📋 Kopiuj listę</button>
</section>

<section class="card">
  <div class="row"><h2 style="flex:1 1 auto;margin:0">Wszystkie kody</h2><button class="ghost" id="refresh" style="flex:0 0 auto">↻ Odśwież</button></div>
  <p class="muted">Zmiany (blokada, reset) działają w ciągu ok. 1 minuty.</p>
  <input id="filter" placeholder="Szukaj po nazwie lub kodzie">
  <p class="muted" id="sum"></p>
  <table><thead><tr><th>Nazwa / kod</th><th>Urządzenia</th><th>Akcje</th></tr></thead><tbody id="tb"></tbody></table>
</section>
<p class="err" id="msg"></p>
</div>

<script>
const $ = id => document.getElementById(id);
let PW = sessionStorage.getItem('nsw_admin') || '';
let ALL = [];

async function api(method, body, query) {
  const r = await fetch('/api/admin/kody' + (query || ''), { method, headers: { 'X-Admin': PW, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const d = await r.json().catch(() => ({ blad: 'Błąd serwera (' + r.status + ')' }));
  if (r.status === 401) { logout(d.blad); throw new Error(d.blad); }
  if (!r.ok) { $('msg').textContent = d.blad || 'Błąd'; throw new Error(d.blad); }
  $('msg').textContent = '';
  return d;
}
function logout(m) { PW = ''; sessionStorage.removeItem('nsw_admin'); $('panel').hidden = true; $('login').hidden = false; $('pwe').textContent = m || ''; }
async function login() {
  PW = $('pw').value; 
  try { await load(); sessionStorage.setItem('nsw_admin', PW); $('login').hidden = true; $('panel').hidden = false; } catch {}
}
$('pwb').onclick = login; $('pw').onkeydown = e => { if (e.key === 'Enter') login(); };

async function load() { ALL = (await api('GET')).kody; render(); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function render() {
  const f = $('filter').value.trim().toLowerCase();
  const rows = ALL.filter(k => !f || (k.name || '').toLowerCase().includes(f) || k.code.toLowerCase().includes(f));
  const used = ALL.reduce((a, k) => a + (k.n || 0), 0);
  $('sum').textContent = `Kodów: ${ALL.length} · zajętych urządzeń: ${used} · zablokowanych: ${ALL.filter(k => k.blocked).length}`;
  $('tb').innerHTML = rows.map(k => `<tr>
    <td><strong>${esc(k.name)}</strong><br><code>${esc(k.code)}</code> ${k.blocked ? '<span class="tag b">zablokowany</span>' : ''}<div class="dev" id="d-${k.code}"></div></td>
    <td>${k.n || 0} / ${k.max ? k.max : '∞'}</td>
    <td><div class="acts">
      <button class="ghost" data-a="devs" data-k="${k.code}">Pokaż</button>
      <button class="ghost" data-a="reset" data-k="${k.code}">Zwolnij wszystkie</button>
      <button class="${k.blocked ? '' : 'bad'}" data-a="blokuj" data-k="${k.code}" data-v="${k.blocked ? 0 : 1}">${k.blocked ? 'Odblokuj' : 'Zablokuj'}</button>
      <button class="ghost" data-a="limit" data-k="${k.code}">Limit</button>
      <button class="ghost" data-a="usun" data-k="${k.code}">Usuń</button>
    </div></td></tr>`).join('');
}
$('filter').oninput = render; $('refresh').onclick = load;

$('tb').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const kod = b.dataset.k, a = b.dataset.a;
  if (a === 'devs') {
    const r = (await api('GET', null, '?kod=' + kod)).kod;
    const box = $('d-' + kod);
    box.innerHTML = r.devices.length ? r.devices.map(d => `${esc(d.ua)} · ${new Date(d.ts).toLocaleString('pl-PL')} <button class="ghost" style="padding:2px 6px;font-size:12px" data-a="reset1" data-k="${kod}" data-d="${d.id}">zwolnij</button>`).join('<br>') : 'brak urządzeń';
    return;
  }
  if (a === 'reset1') { await api('POST', { akcja: 'reset', kod, urzadzenie: b.dataset.d }); }
  if (a === 'reset' && confirm('Zwolnić wszystkie urządzenia tego kodu? Osoby będą musiały wpisać kod ponownie.')) await api('POST', { akcja: 'reset', kod });
  if (a === 'blokuj') await api('POST', { akcja: 'blokuj', kod, blokada: b.dataset.v === '1' });
  if (a === 'limit') { const v = prompt('Nowy limit urządzeń (0 = bez limitu):'); if (v === null) return; await api('POST', { akcja: 'limit', kod, max: v }); }
  if (a === 'usun' && confirm('Usunąć kod ' + kod + '? Tej operacji nie da się cofnąć.')) await api('POST', { akcja: 'usun', kod });
  setTimeout(load, 300);
};

function showNew(list) {
  $('newbox').hidden = false;
  $('newlist').textContent = list.map(k => `${k.name} – ${k.code}` + (k.max === 0 ? ' (bez limitu)' : ` (urządzeń: ${k.max})`)).join('\n');
  $('newbox').scrollIntoView({ behavior: 'smooth' });
}
$('genp').onclick = async () => {
  const nazwy = $('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!nazwy.length) return alert('Wpisz przynajmniej jedno imię.');
  const d = await api('POST', { akcja: 'nowe', nazwy, max: $('pmax').value });
  $('names').value = ''; showNew(d.nowe); load();
};
$('geng').onclick = async () => {
  const d = await api('POST', { akcja: 'nowe', nazwa: $('gname').value || 'Kod wspólny', max: $('gmax').value, kod: $('gcode').value });
  $('gcode').value = ''; showNew(d.nowe); load();
};
$('copy').onclick = () => navigator.clipboard.writeText($('newlist').textContent).then(() => { $('copy').textContent = '✅ Skopiowano'; setTimeout(() => $('copy').textContent = '📋 Kopiuj listę', 1500); });

if (PW) { $('pw').value = PW; login(); }
</script>
</main></body></html>
